<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acme Projects</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --panel: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --danger: #dc2626;
        --success: #059669;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 32px;
        padding: 0 40px;
        height: 64px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 18px;
      }
      .logo-mark {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: linear-gradient(135deg, #6366f1, #a855f7);
      }
      .nav {
        display: flex;
        gap: 4px;
      }
      .nav button {
        padding: 8px 14px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font-weight: 500;
      }
      .nav button:hover {
        background: #f3f4f6;
        color: var(--text);
      }
      .nav button[aria-current='page'] {
        background: #eef2ff;
        color: var(--accent);
      }
      .avatar {
        margin-left: auto;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #c7d2fe;
        display: grid;
        place-items: center;
        font-weight: 600;
        color: #3730a3;
      }
      main {
        max-width: 1080px;
        margin: 40px auto;
        padding: 0 24px;
        animation: view-in 250ms ease-out;
      }
      @keyframes view-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      .page-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-bottom: 24px;
      }
      .page-header h1 {
        margin: 0;
        font-size: 28px;
      }
      .page-header p {
        margin: 4px 0 0;
        color: var(--muted);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border: 1px solid transparent;
        border-radius: 10px;
        font-weight: 600;
        transition: background 150ms;
      }
      .btn-primary {
        background: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .btn-primary:disabled {
        opacity: 0.75;
        cursor: progress;
      }
      .btn-secondary {
        background: var(--panel);
        border-color: var(--border);
        color: var(--text);
      }
      .btn-danger {
        background: var(--danger);
        color: #fff;
      }
      .btn-ghost {
        padding: 6px 12px;
        background: transparent;
        border-color: var(--border);
        color: var(--muted);
        font-weight: 500;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: #fafafa;
      }
      td {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
      }
      tr:last-child td {
        border-bottom: 0;
      }
      tr.new td {
        animation: row-flash 2.4s ease-out;
      }
      @keyframes row-flash {
        from {
          background: #e0e7ff;
        }
        to {
          background: transparent;
        }
      }
      .badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 500;
      }
      .badge-active {
        background: #d1fae5;
        color: #065f46;
      }
      .badge-archived {
        background: #f3f4f6;
        color: var(--muted);
      }
      .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(17, 24, 39, 0.45);
        display: grid;
        place-items: center;
        animation: fade-in 200ms ease-out;
      }
      .backdrop.closing {
        animation: fade-out 180ms ease-in forwards;
      }
      .dialog {
        width: 520px;
        background: var(--panel);
        border-radius: 16px;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.18);
        animation: pop-in 220ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      .backdrop.closing .dialog {
        animation: pop-out 180ms ease-in forwards;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
      }
      @keyframes fade-out {
        to {
          opacity: 0;
        }
      }
      @keyframes pop-in {
        from {
          opacity: 0;
          transform: scale(0.94) translateY(8px);
        }
      }
      @keyframes pop-out {
        to {
          opacity: 0;
          transform: scale(0.96);
        }
      }
      .dialog header {
        padding: 22px 24px 0;
      }
      .dialog h2 {
        margin: 0;
        font-size: 20px;
      }
      .dialog header p {
        margin: 4px 0 0;
        color: var(--muted);
      }
      .dialog form {
        padding: 20px 24px 24px;
        display: grid;
        gap: 16px;
      }
      .field {
        display: grid;
        gap: 6px;
      }
      .field > label,
      .field legend {
        font-weight: 600;
        font-size: 14px;
      }
      .field input[type='text'],
      .field select,
      .field textarea {
        width: 100%;
        padding: 10px 12px;
        font: inherit;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
      }
      .field textarea {
        min-height: 84px;
        resize: none;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        outline: 2px solid #c7d2fe;
        border-color: var(--accent);
      }
      .field.invalid input {
        border-color: var(--danger);
      }
      .error {
        color: var(--danger);
        font-size: 13px;
        animation: fade-in 150ms;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }
      .choices {
        display: flex;
        gap: 12px;
      }
      .choice {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-weight: 500;
      }
      .checkbox {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 4px;
      }
      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 700ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .toast {
        position: fixed;
        top: 84px;
        right: 32px;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 14px 18px;
        background: #111827;
        color: #fff;
        border-radius: 12px;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
        animation: toast-in 300ms cubic-bezier(0.2, 0.9, 0.3, 1.1);
      }
      .toast-icon {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--success);
        display: grid;
        place-items: center;
        font-size: 13px;
      }
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateX(24px);
        }
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .member {
        padding: 20px;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .setting {
        padding: 20px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
      }
      .setting:last-child {
        border-bottom: 0;
      }
      .switch {
        width: 44px;
        height: 24px;
        border-radius: 999px;
        border: 0;
        background: #d1d5db;
        position: relative;
        transition: background 200ms;
      }
      .switch::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        transition: transform 200ms;
      }
      .switch[aria-checked='true'] {
        background: var(--accent);
      }
      .switch[aria-checked='true']::after {
        transform: translateX(20px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="dist/app.js"></script>
  </body>
</html>
